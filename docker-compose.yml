services:
  db:
    image: postgres:16-alpine
    container_name: wash_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: washdb
      POSTGRES_USER: washuser
      POSTGRES_PASSWORD: washpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wash_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: wash_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    container_name: wash_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  celery_beat:
    build: ./backend
    container_name: wash_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: wash_frontend
    restart: unless-stopped
    command: npm run dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend

volumes:
  postgres_data: