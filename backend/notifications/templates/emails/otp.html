<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Your Verification Code - The Black Wash</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #080B10; color: #F5F7FA; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background-color: #101923; border: 1px solid #263442; border-radius: 16px; padding: 32px; }
    .header { text-align: center; margin-bottom: 24px; }
    .brand { font-size: 20px; font-weight: bold; color: #00CFFF; letter-spacing: 1.5px; }
    .title { font-size: 18px; margin: 16px 0 8px; color: #FFFFFF; }
    .subtitle { font-size: 14px; color: #7B8492; line-height: 1.5; }
    .otp-card { background-color: #182431; border: 1px solid #00CFFF; border-radius: 12px; padding: 20px; text-align: center; margin: 24px 0; }
    .otp-code { font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #00CFFF; margin: 0; }
    .footer { text-align: center; font-size: 12px; color: #7B8492; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">THE BLACK WASH</div>
      <div class="title">Verification Code</div>
      <div class="subtitle">Use the 6-digit verification code below to complete your request. This code is valid for 10 minutes.</div>
    </div>
    <div class="otp-card">
      <div class="otp-code">{{ otp }}</div>
    </div>
    <div class="subtitle" style="text-align: center;">If you did not request this verification code, please ignore this email.</div>
    <div class="footer">
      &copy; The Black Wash &middot; Doorstep Car Care &middot; Hazaribagh, Jharkhand
    </div>
  </div>
</body>
</html>
