<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Welcome to The Black Wash</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #080B10; color: #F5F7FA; margin: 0; padding: 20px; }
    .container { max-width: 500px; margin: 0 auto; background-color: #101923; border: 1px solid #263442; border-radius: 16px; padding: 32px; }
    .header { text-align: center; margin-bottom: 24px; }
    .brand { font-size: 20px; font-weight: bold; color: #00CFFF; letter-spacing: 1.5px; }
    .title { font-size: 18px; margin: 16px 0 8px; color: #FFFFFF; }
    .subtitle { font-size: 14px; color: #7B8492; line-height: 1.6; }
    .footer { text-align: center; font-size: 12px; color: #7B8492; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">THE BLACK WASH</div>
      <div class="title">Welcome, {{ name }}!</div>
      <div class="subtitle">Thank you for joining The Black Wash. Your account has been successfully verified and is ready for doorstep car washing and detailing in Hazaribagh.</div>
    </div>
    <div class="footer">
      &copy; The Black Wash &middot; Your Car. Our Care.
    </div>
  </div>
</body>
</html>
