<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Black Wash{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #080A0C;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #A7B0B7;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            padding: 30px 12px;
            background-color: #080A0C;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0D1115;
            border: 1px solid #26313A;
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            background-color: #050708;
            padding: 32px 24px;
            text-align: center;
            border-bottom: 1px solid #1D252B;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #F5F7F8;
            letter-spacing: -0.5px;
            text-transform: uppercase;
        }

        .logo span {
            color: #19C7F3;
        }

        .subtitle {
            margin-top: 6px;
            font-size: 11px;
            font-weight: 700;
            color: #707A82;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content {
            padding: 32px 24px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 24px;
            font-weight: 700;
            color: #F5F7F8;
            letter-spacing: -0.5px;
        }

        h2 {
            margin: 0 0 12px;
            font-size: 18px;
            font-weight: 700;
            color: #F5F7F8;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
            color: #A7B0B7;
            margin: 0 0 16px;
        }

        .card {
            margin: 24px 0;
            padding: 20px;
            border: 1px solid #26313A;
            border-radius: 12px;
            background-color: #12171C;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table td {
            padding: 10px 0;
            font-size: 14px;
            color: #A7B0B7;
            border-bottom: 1px solid #1D252B;
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .table td:first-child {
            font-weight: 600;
            color: #707A82;
        }

        .table td:last-child {
            text-align: right;
            color: #F5F7F8;
            font-weight: 600;
        }

        .otp-box {
            display: inline-block;
            background-color: #080A0C;
            border: 2px solid #19C7F3;
            color: #19C7F3;
            padding: 16px 36px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 8px;
            margin: 16px 0;
        }

        .button {
            display: inline-block;
            margin-top: 16px;
            padding: 14px 28px;
            background-color: #19C7F3;
            color: #050708 !important;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            background-color: rgba(25, 199, 243, 0.15);
            border: 1px solid rgba(25, 199, 243, 0.3);
            border-radius: 20px;
            color: #19C7F3;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .footer {
            padding: 24px;
            background-color: #050708;
            border-top: 1px solid #1D252B;
            text-align: center;
            color: #707A82;
            font-size: 12px;
        }

        .footer a {
            color: #19C7F3;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px 16px;
            }
            .header {
                padding: 24px 16px;
            }
            .otp-box {
                font-size: 26px;
                padding: 12px 24px;
                letter-spacing: 6px;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="container">
            <div class="header">
                <div class="logo">
                    The Black <span>Wash</span>
                </div>
                <div class="subtitle">
                    Premium Mobile Car Detailing • At Your Doorstep
                </div>
            </div>

            <div class="content">
                {% block content %}{% endblock %}
            </div>

            <div class="footer">
                <p style="margin: 0; font-weight: 700; color: #F5F7F8;">
                    The Black Wash 🚗✨
                </p>
                <p style="margin-top: 6px;">
                    Doorstep Mobile Car Wash • Professional Equipment & Polish
                </p>
                <p style="margin-top: 16px;">
                    Need assistance? <a href="mailto:{{ support_email }}">{{ support_email }}</a>
                </p>
                <p style="margin-top: 12px; color: #4A5560;">
                    © {% now "Y" %} The Black Wash. All Rights Reserved.
                </p>
            </div>
        </div>
    </div>
</body>

</html>
