<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <title>{% block title %}Washly{% endblock %}</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f5f7fb;
            font-family: Arial, Helvetica, sans-serif;
            color: #1d2433;
        }

        .wrapper {
            width: 100%;
            padding: 40px 15px;
            background: #f5f7fb;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, .08);
        }

        .header {
            background: #1d212b;
            padding: 35px;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: .5px;
        }

        .logo span {
            color: #ff6b22;
        }

        .subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #c7cad3;
        }

        .content {
            padding: 40px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 30px;
            color: #1d212b;
        }

        p {
            font-size: 15px;
            line-height: 1.8;
            color: #5f6674;
        }

        .card {
            margin: 30px 0;
            padding: 24px;
            border: 1px solid #ececec;
            border-radius: 14px;
            background: #fafafa;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table td {
            padding: 12px 0;
            font-size: 15px;
            border-bottom: 1px solid #ececec;
        }

        .table td:first-child {
            font-weight: 700;
            color: #1d212b;
        }

        .badge {
            display: inline-block;
            padding: 9px 18px;
            background: #ff6b22;
            border-radius: 30px;
            color: white;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 25px;
            padding: 15px 34px;
            background: #ff6b22;
            color: #fff !important;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
        }

        .footer {
            padding: 30px;
            background: #1d212b;
            text-align: center;
            color: #d4d7de;
            font-size: 13px;
        }

        .footer a {
            color: #ff6b22;
            text-decoration: none;
        }

        @media(max-width:600px) {

            .content {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .table td {
                display: block;
                width: 100%;
                padding: 8px 0;
                border: none;
            }

        }
    </style>

</head>

<body>

    <div class="wrapper">

        <div class="container">

            <div class="header">

                <div class="logo">
                    Wash<span>ly</span>
                </div>

                <div class="subtitle">
                    Premium Vehicle Care & Car Wash
                </div>

            </div>

            <div class="content">

                {% block content %}

                {% endblock %}

            </div>

            <div class="footer">

                <p style="margin:0;font-weight:bold;">
                    Thank you for choosing Washly 🚗
                </p>

                <p style="margin-top:8px;">
                    Premium Car Wash • Fast Booking • Professional Detailing
                </p>

                <p style="margin-top:20px;">
                    Need help?
                    <a href="mailto:{{ support_email }}">
                        {{ support_email }}
                    </a>
                </p>

                <p style="margin-top:20px;">
                    © {% now "Y" %} Washly.
                    All Rights Reserved.
                </p>

            </div>

        </div>

    </div>

</body>

</html>
